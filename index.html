<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Campo</title>
<meta name="description" content="Blog de Geografia: um tema por semana, explicado em partes, com ilustrações e questões no estilo ENEM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="banda" id="banda">
  <canvas class="contornos" aria-hidden="true"></canvas>
  <header class="wrap">
    <div class="col topo-in">
      <a class="marca" href="#inicio">
        <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="5" ry="11"/><path d="M5 16H27M7 10H25M7 22H25"/></svg></span>
        <span class="marca-txt"><b data-blog="nome">Caderno de Campo</b><small data-blog="slogan">Blog de Geografia</small></span>
      </a>
      <nav class="menu" aria-label="Menu principal">
        <a href="#inicio" data-menu="inicio">Início</a>
        <a href="#arquivo" data-menu="arquivo">Posts</a>
        <a href="#sobre" data-menu="sobre">Sobre</a>
      </nav>
    </div>
  </header>
  <div class="wrap"><div class="col" id="hero"></div></div>
</div>

<div class="progresso" id="progresso" hidden><span></span></div>

<main id="conteudo" class="wrap">
  <noscript><p class="col vazio">Este blog precisa de JavaScript ativado para mostrar os posts.</p></noscript>
</main>

<footer class="rodape">
  <div class="wrap"><div class="col rodape-in" id="rodape"></div></div>
</footer>

<script src="js/ilustracoes.js"></script>
<script src="js/posts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
